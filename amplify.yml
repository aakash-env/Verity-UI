version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm i -g pnpm@11
        - pnpm install
    build:
      commands:
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
